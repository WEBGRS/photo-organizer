<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片整理浏览器</title>
<style>
  :root { --bg:#111418; --panel:#1b2028; --fg:#e8eaed; --muted:#9aa3ad; --accent:#4c8dff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--panel); padding:10px 14px;
           display:flex; flex-wrap:wrap; gap:8px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  header h1 { font-size:16px; margin-right:6px; white-space:nowrap; }
  select, button, input[type=text] {
    background:#242b35; color:var(--fg); border:1px solid #333c48; border-radius:8px;
    padding:8px 10px; font-size:14px; }
  select { max-width:46vw; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #count { color:var(--muted); font-size:13px; white-space:nowrap; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:6px; padding:10px; }
  .cell { position:relative; aspect-ratio:1; overflow:hidden; border-radius:8px; background:#20262e; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell .ck { position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%;
              background:rgba(0,0,0,.55); border:2px solid #fff; display:none; }
  body.selecting .cell .ck { display:block; }
  .cell.sel .ck { background:var(--accent); border-color:var(--accent); }
  .cell.sel img { outline:3px solid var(--accent); outline-offset:-3px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.93); display:none;
              flex-direction:column; align-items:center; justify-content:center; z-index:50; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:96vw; max-height:88vh; object-fit:contain; }
  #lbName { color:var(--muted); font-size:13px; padding:8px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:center; justify-content:center; z-index:60; }
  #modal.open { display:flex; }
  #modal .box { background:var(--panel); border-radius:12px; padding:18px; width:min(440px,92vw);
                display:flex; flex-direction:column; gap:12px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2c3542;
           padding:10px 18px; border-radius:20px; font-size:14px; display:none; z-index:70; }
</style>
</head>
<body>
<header>
  <h1>📷 照片整理</h1>
  <select id="regionSel"></select>
  <select id="folderSel"></select>
  <span id="count"></span>
  <button id="selBtn">选择</button>
  <button id="allBtn" style="display:none">全选</button>
  <button id="moveBtn" class="primary" style="display:none" disabled>移动到…</button>
  <button id="renameBtn">重命名文件夹</button>
</header>
<div id="grid"></div>

<div id="lightbox">
  <img id="lbImg" alt="">
  <div id="lbName"></div>
</div>

<div id="modal"><div class="box">
  <b>移动 <span id="mvCount"></span> 张照片到：</b>
  <select id="destSel"></select>
  <input type="text" id="newFolder" placeholder="或输入新文件夹名（建在本地区 scenery 下）">
  <div style="display:flex; gap:10px; justify-content:flex-end">
    <button onclick="closeModal()">取消</button>
    <button class="primary" onclick="doMove()">确定移动</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
let tree = [], curRel = null, photos = [], selecting = false, selected = new Set();
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2500);
}

async function loadTree(keepRel) {
  tree = await (await fetch("/api/tree")).json();
  const rs = $("regionSel"); rs.innerHTML = "";
  tree.forEach((r, i) => rs.add(new Option(r.region, i)));
  if (keepRel) {
    for (let i = 0; i < tree.length; i++)
      if (tree[i].cats.some(c => c.rel === keepRel)) { rs.value = i; break; }
  }
  fillFolders(keepRel);
}

function fillFolders(keepRel) {
  const r = tree[$("regionSel").value]; if (!r) return;
  const fs = $("folderSel"); fs.innerHTML = "";
  r.cats.forEach(c => fs.add(new Option(`${c.name} (${c.count})`, c.rel)));
  if (keepRel && r.cats.some(c => c.rel === keepRel)) fs.value = keepRel;
  loadPhotos(fs.value);
}

async function loadPhotos(rel) {
  curRel = rel; selected.clear(); updateBar();
  photos = await (await fetch(`/api/photos?rel=${enc(rel)}`)).json();
  $("count").textContent = `${photos.length} 张`;
  const g = $("grid"); g.innerHTML = "";
  photos.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "cell"; d.dataset.rel = p.rel;
    d.innerHTML = `<img loading="lazy" src="/thumb?rel=${enc(p.rel)}" alt=""><div class="ck"></div>`;
    d.onclick = () => selecting ? toggleSel(d) : openLb(i);
    g.appendChild(d);
  });
}

function toggleSel(cell) {
  const rel = cell.dataset.rel;
  if (selected.has(rel)) { selected.delete(rel); cell.classList.remove("sel"); }
  else { selected.add(rel); cell.classList.add("sel"); }
  updateBar();
}

function updateBar() {
  $("moveBtn").textContent = `移动到… (${selected.size})`;
  $("moveBtn").disabled = selected.size === 0;
}

$("selBtn").onclick = () => {
  selecting = !selecting; document.body.classList.toggle("selecting", selecting);
  $("selBtn").textContent = selecting ? "取消选择" : "选择";
  $("moveBtn").style.display = $("allBtn").style.display = selecting ? "" : "none";
  if (!selecting) { selected.clear(); document.querySelectorAll(".cell.sel").forEach(c => c.classList.remove("sel")); updateBar(); }
};
$("allBtn").onclick = () => {
  document.querySelectorAll(".cell").forEach(c => { selected.add(c.dataset.rel); c.classList.add("sel"); });
  updateBar();
};

$("moveBtn").onclick = () => {
  const ds = $("destSel"); ds.innerHTML = "";
  tree.forEach(r => {
    const og = document.createElement("optgroup"); og.label = r.region;
    r.cats.forEach(c => { if (c.rel !== curRel) og.appendChild(new Option(c.name, c.rel)); });
    ds.appendChild(og);
  });
  $("newFolder").value = "";
  $("mvCount").textContent = selected.size;
  $("modal").classList.add("open");
};
function closeModal() { $("modal").classList.remove("open"); }

async function doMove() {
  let dest = $("destSel").value;
  const nf = $("newFolder").value.trim();
  if (nf) {
    const region = curRel.split(/[\\/]/)[0];
    dest = `${region}\\scenery\\${nf.replace(/[\\/:*?"<>|]/g, "")}`;
  }
  const res = await fetch("/api/move", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ items: [...selected], dest }) });
  if (!res.ok) { toast("移动失败: " + (await res.text())); return; }
  const j = await res.json();
  closeModal(); toast(`已移动 ${j.moved} 张（RAW 已跟随）`);
  await loadTree(curRel);
}

$("renameBtn").onclick = async () => {
  const cur = curRel.split(/[\\/]/).pop();
  const name = prompt("新文件夹名：", cur);
  if (!name || name === cur) return;
  const res = await fetch("/api/rename", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ rel: curRel, new_name: name }) });
  if (!res.ok) { toast("重命名失败: " + (await res.text())); return; }
  const j = await res.json();
  toast("已重命名"); await loadTree(j.rel);
};

let lbIdx = 0;
function openLb(i) {
  lbIdx = i;
  $("lbImg").src = `/full?rel=${enc(photos[i].rel)}`;
  $("lbName").textContent = `${photos[i].name}  (${i + 1}/${photos.length})`;
  $("lightbox").classList.add("open");
}
$("lightbox").onclick = e => {
  const w = window.innerWidth;
  if (e.clientX < w * 0.3 && lbIdx > 0) openLb(lbIdx - 1);
  else if (e.clientX > w * 0.7 && lbIdx < photos.length - 1) openLb(lbIdx + 1);
  else $("lightbox").classList.remove("open");
};
document.addEventListener("keydown", e => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "ArrowLeft" && lbIdx > 0) openLb(lbIdx - 1);
  if (e.key === "ArrowRight" && lbIdx < photos.length - 1) openLb(lbIdx + 1);
  if (e.key === "Escape") $("lightbox").classList.remove("open");
});

$("regionSel").onchange = () => fillFolders();
$("folderSel").onchange = () => loadPhotos($("folderSel").value);
loadTree();
</script>
</body>
</html>
